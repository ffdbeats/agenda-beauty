name: Validate Agenda Beauty

on:
  push:
    branches: ["main", "fix/login-and-saas-foundation"]
  pull_request:
    branches: ["main"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript syntax
        run: node --check src/index.js
      - name: Validate JSON configuration
        run: node -e "JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8'))"
